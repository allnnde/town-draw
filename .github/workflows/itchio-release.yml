name: Release and Deploy to itch.io

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

  versioning:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      tag: ${{ steps.changelog.outputs.tag }}
      skipped: ${{ steps.changelog.outputs.skipped }}
      clean_changelog: ${{ steps.changelog.outputs.clean_changelog }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5.2.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: package.json
          skip-on-empty: false

  release:
    if: needs.versioning.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    needs: versioning

    steps:
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ needs.versioning.outputs.tag }}
          name: ${{ needs.versioning.outputs.tag }}
          body: ${{ needs.versioning.outputs.clean_changelog }}

  deploy-itchio:
    if: needs.versioning.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    needs:
      - versioning
      - release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app for itch.io
        run: npm run build -- --base-href ./

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v3

      - name: Deploy to itch.io
        run: butler push dist/town-draw/browser ${{ secrets.ITCH_USERNAME }}/${{ secrets.ITCH_PROJECT }}:html5 --userversion ${{ needs.versioning.outputs.tag }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
